name: Build Qylomi APK
run-name: Build Qylomi v1.0.${{ github.run_number }}

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Also build debug APK'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "KEYSTORE_MISSING=true" >> $GITHUB_ENV
              echo "Skipping release build as KEYSTORE_BASE64 is missing (PR from fork?)."
            else
              echo "Error: KEYSTORE_BASE64 secret is missing!"
              exit 1
            fi
          else
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        if: env.KEYSTORE_MISSING != 'true'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          
      - name: Build Debug APK (Optional)
        if: ${{ github.event.inputs.build_debug == 'true' || github.event_name == 'pull_request' || env.KEYSTORE_MISSING == 'true' }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Release APK
        if: env.KEYSTORE_MISSING != 'true'
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk")
          echo "APK_SIZE=$(ls -lh $APK_PATH | awk '{print $5}')" >> $GITHUB_ENV
          apksigner verify --print-certs "$APK_PATH" | grep "SHA-256"

      - name: Prepare Artifacts
        run: |
          mkdir -p dist/mapping
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/ \;
          find app/build/outputs/mapping/release -name "mapping.txt" -exec cp {} dist/mapping/ \; || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Qylomi-v1.0.${{ github.run_number }}-release
          path: dist/*-release.apk
          retention-days: 30

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qylomi-v1.0.${{ github.run_number }}-debug
          path: dist/*-debug.apk
          retention-days: 7

      - name: Upload ProGuard Mapping
        if: env.KEYSTORE_MISSING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Qylomi-v1.0.${{ github.run_number }}-mapping
          path: dist/mapping/mapping.txt
          retention-days: 30

      - name: Generate Workflow Summary
        run: |
          echo "### 🚀 Qylomi Build v1.0.${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Size** | \`${{ env.APK_SIZE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download APKs from the **Artifacts** section." >> $GITHUB_STEP_SUMMARY
