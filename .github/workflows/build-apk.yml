name: Build Qylomi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release_unsigned
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment and Secrets
        run: |
          echo "Setting up environment configuration..."
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Copied .env.example to .env"
          elif [ ! -f ".env" ]; then
            touch .env
            echo "Created empty .env"
          fi

      - name: Prepare Keystore
        run: |
          echo "Configuring signing keystore..."
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully decoded debug.keystore from base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          else
            echo "debug.keystore is already present"
          fi

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: |
          echo "Building Debug APK with Gradle..."
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release (Unsigned) APK
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release_unsigned' || github.event.inputs.build_type == 'both') }}
        run: |
          echo "Building Release APK with Gradle..."
          gradle :app:assembleRelease --no-daemon --stacktrace || true

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/ \;
          echo "Listing generated APK files in dist/:"
          ls -la dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qylomi-Android-APK
          path: dist/*.apk
          retention-days: 30

      - name: Generate Workflow Summary
        run: |
          echo "### 🚀 Qylomi Android Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | Qylomi |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Generated APK Files:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section at the top of this run summary." >> $GITHUB_STEP_SUMMARY
