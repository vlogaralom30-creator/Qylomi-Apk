name: Build Qylomi APK
run-name: Build Qylomi v1.0.${{ github.run_number }}

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'migration_*.sql'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'migration_*.sql'
  workflow_dispatch:
    inputs:
      build_debug:
        description: 'Also build debug APK'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare Environment
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing, generating wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Decode Keystores
        id: decode_keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew

          # Decode Release Keystore if secret is present
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_MISSING=true" >> $GITHUB_ENV
            echo "Warning: KEYSTORE_BASE64 secret is missing. Release signing is disabled."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
          fi

          # Decode Debug Keystore if it exists in the repo
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Debug keystore decoded from repository."
          fi

      - name: Build Release APK
        if: env.KEYSTORE_MISSING != 'true'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          
      - name: Build Debug APK (Optional)
        if: ${{ github.event.inputs.build_debug == 'true' || github.event_name == 'pull_request' || env.KEYSTORE_MISSING == 'true' }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Run Unit Tests (Non-blocking)
        if: always()
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon || echo "UNIT_TEST_FAILED=true" >> $GITHUB_ENV

      - name: Verify Release APK
        if: env.KEYSTORE_MISSING != 'true' && success()
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "APK_SIZE=$(ls -lh $APK_PATH | awk '{print $5}')" >> $GITHUB_ENV
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              $APKSIGNER verify --print-certs "$APK_PATH" | grep "SHA-256"
            else
              echo "apksigner not found in build-tools"
            fi
          else
            echo "Release APK not found for verification."
          fi

      - name: Prepare Artifacts
        if: always()
        run: |
          mkdir -p dist/mapping
          echo "Searching for APKs..."
          if [ -d app/build/outputs/apk ]; then
            find app/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/ \; || true
          else
            echo "No APK output folder (build failed earlier)"
          fi
          
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist/mapping/ || true
          fi
          
          ls -R dist || true

      - name: Upload Release APK
        if: success() && env.KEYSTORE_MISSING != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Qylomi-v1.0.${{ github.run_number }}-Release-APK
          path: dist/*-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Qylomi-v1.0.${{ github.run_number }}-Debug-APK
          path: dist/*-debug.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload ProGuard Mapping
        if: success() && env.KEYSTORE_MISSING != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Qylomi-v1.0.${{ github.run_number }}-ProGuard-Mapping
          path: dist/mapping/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Build Log on Failure
        if: failure() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Capture Build Failure Details
        if: failure() && hashFiles('build.log') != ''
        run: |
          echo "### ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### What Went Wrong:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A15 "What went wrong" build.log || echo "No 'What went wrong' section found in build.log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Kotlin Compile Errors (^e:):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep "^e: " build.log | head -n 40 || echo "No Kotlin compile errors found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate Workflow Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          KEYSTORE_MISSING: ${{ env.KEYSTORE_MISSING }}
          APK_SIZE: ${{ env.APK_SIZE }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Qylomi Build v1.0.${RUN_NUMBER}"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            if [ "$JOB_STATUS" = "success" ]; then
              echo "| **Result** | ✅ Success |"
            else
              echo "| **Result** | ❌ ${JOB_STATUS} |"
            fi
            if [ "$KEYSTORE_MISSING" = "true" ]; then
              echo "| **Build Type** | Debug (debug key) |"
              echo "| **Release** | Skipped: KEYSTORE_BASE64 secret not set |"
            else
              echo "| **Build Type** | Release (signed) |"
              echo "| **Release Size** | ${APK_SIZE:-N/A} |"
            fi
            echo "| **Branch** | ${REF_NAME} |"
            echo "| **Commit** | ${COMMIT_SHA} |"
            echo ""
            echo "#### APKs"
            if ls dist/*.apk >/dev/null 2>&1; then
              for f in dist/*.apk; do
                echo "- $(basename "$f") ($(du -h "$f" | cut -f1))"
              done
            else
              echo "No APKs found."
            fi
            echo ""
            echo "Download APKs from the Artifacts section at the top of this page."
          } >> "$GITHUB_STEP_SUMMARY"
