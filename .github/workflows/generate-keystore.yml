name: Generate One-Time Keystore
run-name: Generate One-Time Keystore for ${{ github.actor }}

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          PASSWORD=$(openssl rand -base64 12)
          echo "GENERATED_PASSWORD=$PASSWORD" >> $GITHUB_ENV
          
          keytool -genkeypair -v \
            -keystore upload.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Qylomi Release, OU=Development, O=Naxxivo, L=Dhaka, ST=Dhaka, C=BD"
            
          base64 -w 0 upload.jks > keystore_base64.txt
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-material
          path: |
            upload.jks
            keystore_base64.txt
          retention-days: 1 # Extremely short-lived

      - name: Instructions
        run: |
          echo "### ⚠️ ACTION REQUIRED: KEYSTORE GENERATED" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact **release-keystore-material** immediately." >> $GITHUB_STEP_SUMMARY
          echo "2. Save **upload.jks** in a safe place (Google Drive, hardware key, etc.). If you lose this, you can NEVER update your app again." >> $GITHUB_STEP_SUMMARY
          echo "3. Copy the contents of **keystore_base64.txt** and add it as a GitHub Secret: \`KEYSTORE_BASE64\`." >> $GITHUB_STEP_SUMMARY
          echo "4. Add the password below as GitHub Secrets: \`STORE_PASSWORD\` and \`KEY_PASSWORD\`." >> $GITHUB_STEP_SUMMARY
          echo "5. **DELETE THIS WORKFLOW AND THE ARTIFACT** once the secrets are set." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### PASSWORD FOR SECRETS:" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.GENERATED_PASSWORD }}\`" >> $GITHUB_STEP_SUMMARY
